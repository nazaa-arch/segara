; Firmware node pelampung SEGARA
; Build & flash : pio run -e node -t upload
; Uji payload PC: pio test -e native

[env:node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
test_ignore = *

[env:native]
platform = native
test_build_src = no
build_flags = -I include -std=c11 -lm
