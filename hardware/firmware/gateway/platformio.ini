; Gateway LoRa -> Wi-Fi -> MQTT SEGARA (board ber-LoRa terintegrasi, mis. LilyGO TTGO LoRa32)
; Salin include/secrets.example.h menjadi include/secrets.h lalu isi kredensial.
; Build & flash: pio run -e gateway -t upload

[env:gateway]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    knolleary/PubSubClient@^2.8
